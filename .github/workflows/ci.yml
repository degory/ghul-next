# CI/CD pipeline. 

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches: [main]

# Serialize builds: pushes to a given ref run one at a time so concurrent
# builds can't race over version numbers or the published package. PR builds
# keep their own per-ref group and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request from a fork runs in *this* repository's context, so it would
# otherwise spend this repository's Ubicloud runners. Each test job's `runs-on`
# therefore sends a fork's pull request to a GitHub-hosted runner instead, which
# is free on a public repository. `github.event.pull_request` is absent on a
# push, so the expression falls through to the Ubicloud runner for `main`.
#
# This is a default for well-meant contributions, not a control. A `pull_request`
# run uses the workflow file from the pull request itself, so a contributor can
# simply write a different `runs-on`. What actually limits what a fork's pull
# request can spend is the approval requirement under Settings -> Actions, and
# only its "all external contributors" setting keeps applying once someone has
# had a first contribution merged.
#
# A push inside someone else's fork needs no guard at all: it runs in their
# repository, billed to them.

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}
      compiler: ${{ steps.compiler_version.outputs.compiler }}

    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor (a marker
    # in a commit or PR body can no longer trigger a bump). Pull request builds
    # get a -beta.<run> prerelease so they never collide with a real release.
    # The action only reads the repo — it never tags; `create_release` does
    # that, which is what advances the version for the following build.
    #
    # This repo's tags are its own. Versions here are unrelated to the ones
    # degory/ghul publishes, and the two cannot collide: this repo packs under
    # its own package id (`ghul-next.compiler`).
    - name: Determine the version
      id: version
      uses: degory/create-version@v1.0.0
      with:
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

    # Resolve the ghul.compiler version that bootstraps this build.
    #
    # On a pull request: the latest published version that is actually
    # downloadable from NuGet (skipping a release still propagating).
    # On a push to main (the release build): reuse the exact version the
    # merged PR's CI resolved, read from that run's artifact - so the
    # release is bootstrapped with the compiler it was tested with, and
    # a compiler published since the PR ran cannot break the release.
    #
    # The version is published as the `bootstrap-compiler-version`
    # artifact; on a release run that is the diagnostic record of what
    # compiled the release, for as long as the artifact is retained.
    - name: Determine bootstrap compiler version
      id: compiler_version
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        resolve_latest() {
          local versions v
          versions=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/ghul.compiler/index.json \
            | jq -r '.versions | reverse | .[]')
          for v in ${versions}; do
            case "${v}" in *-*) continue ;; esac
            # Skip versions unlisted on nuget.org (e.g. a withdrawn or
            # mis-numbered release). Unlisted versions remain in the
            # flat-container index and stay downloadable, so without this check
            # the resolver would keep selecting the highest such version forever.
            curl -fsSL --compressed "https://api.nuget.org/v3/registration5-gz-semver2/ghul.compiler/${v}.json" \
              | jq -e '.listed' >/dev/null || continue
            if curl -fsI "https://api.nuget.org/v3-flatcontainer/ghul.compiler/${v}/ghul.compiler.${v}.nupkg" >/dev/null 2>&1; then
              printf '%s' "${v}"
              return 0
            fi
          done
          echo "no downloadable ghul.compiler version found" >&2
          return 1
        }

        compiler=""
        if [ "${{ github.event_name }}" = "push" ]; then
          # Release build: carry the version the merged PR's CI resolved.
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                 --jq 'first(.[].number) // empty' 2>/dev/null || true)
          if [ -n "${pr}" ]; then
            head=$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq '.head.sha' 2>/dev/null || true)
            run=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${head}&event=pull_request&status=success" \
                    --jq 'first(.workflow_runs[].id) // empty' 2>/dev/null || true)
            if [ -n "${run}" ] && gh run download "${run}" -n bootstrap-compiler-version -D carried 2>/dev/null; then
              compiler=$(tr -d '[:space:]' < carried/bootstrap-compiler-version.txt)
            fi
          fi
          if [ -z "${compiler}" ]; then
            echo "::warning::could not carry the bootstrap compiler version from PR #${pr:-unknown}; re-resolving latest"
            compiler=$(resolve_latest)
          fi
        else
          compiler=$(resolve_latest)
        fi

        echo "compiler=${compiler}" >> "$GITHUB_OUTPUT"
        echo "Bootstrap compiler: ${compiler}"
        echo "Bootstrap compiler: \`${compiler}\`" >> "$GITHUB_STEP_SUMMARY"
        mkdir -p artifact
        printf '%s\n' "${compiler}" > artifact/bootstrap-compiler-version.txt

    - name: Upload bootstrap compiler version
      uses: actions/upload-artifact@v7
      with:
        name: bootstrap-compiler-version
        path: artifact/bootstrap-compiler-version.txt


  unit_tests:
    name: Run unit tests
    needs: [version]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Add GHCR package source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the bootstrap compiler
      run: |
        for attempt in 1 2 3 4 5; do
          if dotnet tool update --local ghul.compiler --version ${{ needs.version.outputs.compiler }}; then
            exit 0
          fi
          echo "install attempt ${attempt} failed; retrying in 15s..."
          sleep 15
        done
        exit 1

    - name: Set build number
      run: |
        echo "namespace Source is class BUILD is number: string static => \"${{ needs.version.outputs.tag }}\"; si si" >src/source/build.ghul

    - name: Run unit tests
      run: dotnet test unit-tests

  # Builds the compiler and publishes the artefacts every test job consumes.
  #
  # Self-hosting is deliberately not verified here. While the IL back end is
  # being replaced the compiler cannot compile itself, but the test suite
  # still needs a compiler to test — so the build and the self-hosting check
  # are separate concerns, and only the build gates anything. `build/
  # bootstrap.sh` is unreferenced until self-hosting is restored.
  build:
    name: Build compiler
    needs: [version]
    # Single-thread-bound: the ghul compiler doesn't parallelise the source
    # walk. 2 vCPU is enough for a pack alongside one compiler pass.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Add GHCR package source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the bootstrap compiler
      run: |
        for attempt in 1 2 3 4 5; do
          if dotnet tool update --local ghul.compiler --version ${{ needs.version.outputs.compiler }}; then
            exit 0
          fi
          echo "install attempt ${attempt} failed; retrying in 15s..."
          sleep 15
        done
        exit 1

    - name: Pack the compiler
      run: dotnet pack -nologo -p:CI=true -p:Version=${{ needs.version.outputs.package }} -consoleloggerparameters:NoSummary

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-package
        path: ./nupkg/ghul-next.compiler.${{ needs.version.outputs.package }}.nupkg

    # Separate artefact for consumers that need to spawn the bootstrapped
    # compiler as a process (e.g. analysis_tests). The whole tool tree is
    # required, not just ghul.dll: the .NET host needs ghul.runtimeconfig.json
    # / ghul.deps.json beside the dll, and the compiler needs sibling
    # assemblies (ghul-runtime, System.IO.Abstractions, ...), the IL
    # templates under lib/dotnet/il/, and the native ilasm under
    # runtimes/.
    - name: Extract compiler tool tree
      run: |
        unzip -o nupkg/ghul-next.compiler.${{ needs.version.outputs.package }}.nupkg \
          'tools/net10.0/any/*' -d extracted-tool

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-compiler-tool
        path: ./extracted-tool/tools/net10.0/any

    # The analysis protocol client library ships as its own package so
    # out-of-repo tools can drive the compiler's analysis mode. Packed with
    # the same version as the compiler built from this commit.
    - name: Pack analysis protocol library
      run: dotnet pack analysis-protocol/analysis-protocol.ghulproj -nologo -p:CI=true -p:Version=${{ needs.version.outputs.package }}

    - uses: actions/upload-artifact@v7
      with:
        name: ghul-analysis-protocol-package
        path: ./analysis-protocol/nupkg/ghul-next.analysis.protocol.${{ needs.version.outputs.package }}.nupkg

  # parse and semantic compile nothing -- every test in them either suppresses
  # code generation or expects the build to fail -- so this stays green while
  # the IL back end is being replaced. The groups that do emit are run by
  # codegen_tests, which is expected to fail for the duration.
  integration_tests:
    needs: [version, build]
    name: Run integration tests

    # The ghul-test harness spawns cpu*3/2 worker processes for >6 cores
    # (test-queue.ghul:38-52), each running dotnet ghul-compiler. 16 vCPU
    # → 24 parallel workers, the headline parallel-throughput win.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-16' }}

    # A GitHub-hosted runner is 4 vCPU, so a fork's pull request gets 6 workers
    # rather than 24 and needs a budget sized for that, not for the big runner.
    timeout-minutes: ${{ github.event.pull_request.head.repo.fork && 25 || 5 }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Add GHCR package source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul-next.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    # Pin the runtime DLL the compiled test binaries link against to the
    # one the bootstrapped compiler ships with, not whatever runtime
    # ghul.test was packaged with. Without this, an integration test
    # that uses a runtime feature added since the ghul.test publish
    # would fail to resolve the symbol - because ghul-test in CI mode
    # otherwise picks the runtime DLL sitting next to its own binary.
    # GHUL_RUNTIME_DLL was added in ghul-test 1.3.7 (degory/ghul-test#108).
    - name: Run integration tests
      env:
        GHUL_RUNTIME_DLL: ${{ github.workspace }}/bootstrap-tool/ghul-runtime.dll
      run: bash -c "set -o pipefail ; dotnet ghul-test integration-tests/parse integration-tests/semantic | tee test-results.txt"

    - uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: test-results.txt

  # The groups that build and run a binary. Expected to fail while the IL
  # back end is being replaced, which is why it is separate from
  # integration_tests: keeping them apart is what lets the branch require one
  # of them without requiring the other.
  #
  # Publishing does depend on this job, so it stops for as long as this fails.
  # That is the intent - a compiler that cannot emit is not worth putting on a
  # feed - and each run's packed artefact stays downloadable regardless.
  # The execution and il groups need the whole emission surface, of which
  # the SRM back end so far covers a hello world. Reported but not gating
  # until the ported surface catches up, one group at a time.
  codegen_tests:
    needs: [version, build]
    # Disabled until the binary back end can build a working compiler.
    # A job that always fails costs runner minutes and makes every other
    # result read as suspect. Delete the 'if: false' to re-enable.
    #
    # codegen_tests and cross_assembly_tests need only the back end to
    # emit correctly, so they recover first. runtime_tests and
    # examples_tests additionally need their consumer repositories to
    # build against the result, so they recover last.
    #
    # analysis_tests is the exception and does not depend on the back
    # end at all: it drives --analyse, which emits nothing, and fails
    # only because analysis-tests.ghulproj rebuilds the protocol library
    # from source. Referencing the published package instead would let
    # it pass now.
    #
    # Self-hosting is checked by none of these - see the build job - so
    # restoring it is separate work rather than the end of this list.
    if: false
    name: Run codegen tests
    continue-on-error: true

    # The ghul-test harness spawns cpu*3/2 worker processes for >6 cores
    # (test-queue.ghul:38-52), each running dotnet ghul-compiler. 16 vCPU
    # → 24 parallel workers, the headline parallel-throughput win.
    runs-on: ubicloud-standard-16

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Add GHCR package source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul-next.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    # Pin the runtime DLL the compiled test binaries link against to the
    # one the bootstrapped compiler ships with, not whatever runtime
    # ghul.test was packaged with. Without this, an integration test
    # that uses a runtime feature added since the ghul.test publish
    # would fail to resolve the symbol — because ghul-test in CI mode
    # otherwise picks the runtime DLL sitting next to its own binary.
    # GHUL_RUNTIME_DLL was added in ghul-test 1.3.7 (degory/ghul-test#108).
    - name: Run codegen tests
      env:
        GHUL_RUNTIME_DLL: ${{ github.workspace }}/bootstrap-tool/ghul-runtime.dll
      run: bash -c "set -o pipefail ; dotnet ghul-test integration-tests/execution integration-tests/il | tee test-results.txt"

    - uses: actions/upload-artifact@v7
      with:
        name: codegen-test-results
        path: test-results.txt

  # Drives --analyse, which emits nothing, but its fixtures build the
  # analysis-protocol library with the freshly built compiler, so it
  # needs the emission surface after all. Reported but not gating, same
  # as codegen_tests.
  analysis_tests:
    needs: [version, build]
    # Disabled until the binary back end can build a working compiler.
    # A job that always fails costs runner minutes and makes every other
    # result read as suspect. Delete the 'if: false' to re-enable.
    #
    # codegen_tests and cross_assembly_tests need only the back end to
    # emit correctly, so they recover first. runtime_tests and
    # examples_tests additionally need their consumer repositories to
    # build against the result, so they recover last.
    #
    # analysis_tests is the exception and does not depend on the back
    # end at all: it drives --analyse, which emits nothing, and fails
    # only because analysis-tests.ghulproj rebuilds the protocol library
    # from source. Referencing the published package instead would let
    # it pass now.
    #
    # Self-hosting is checked by none of these - see the build job - so
    # restoring it is separate work rather than the end of this list.
    if: false
    name: Run analysis tests
    continue-on-error: true

    # xunit-parallelised; each test spawns the bootstrapped compiler as an
    # analysis-mode subprocess and chats over IPC. Measured: 8 vCPU → 42s,
    # 16 vCPU → 44s. The bottleneck is per-test compiler-subprocess IPC, not
    # core count; bumping past 8 yields no wall-time win, so 8 it is. If this
    # job's wall time becomes painful, the lever is xunit's parallelism
    # settings / the harness, not the runner SKU.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-8' }}

    # Halving the cores should cost little here, per the measurements above, but
    # a fork's pull request runs on a smaller and slower machine than any of
    # them, so give it room rather than have it time out on a cold cache.
    timeout-minutes: ${{ github.event.pull_request.head.repo.fork && 15 || 5 }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Download bootstrap compiler tool tree
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-tool
        path: bootstrap-tool

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Add GHCR package source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    # Build the test runner with the freshly-built compiler - the same one the
    # tests spawn as the compiler under test (the bootstrapped artefact's
    # ghul.dll, via ANALYSIS_TESTS_COMPILER_DLL). Building the harness with the
    # compiler it validates means a breaking language change that invalidates
    # the harness source fails here in its own PR, rather than landing latently
    # and breaking the next PR once the new compiler publishes.
    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul-next.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Run analysis tests
      env:
        ANALYSIS_TESTS_COMPILER_DLL: ${{ github.workspace }}/bootstrap-tool/ghul.dll
      run: dotnet test analysis-tests -p:SkipCompilerProjectRef=true

  # Real .ghulproj builds against a separate assembly, so they need the
  # emission surface too. Reported but not gating, same as codegen_tests.
  cross_assembly_tests:
    needs: [version, build]
    # The first of the disabled jobs to come back. The tests the binary
    # back end cannot yet pass carry a 'disabled' file naming what each
    # is waiting for, so this job gates the rest rather than always
    # failing - see cross-assembly-tests/README.md.
    #
    # Gating, unlike the jobs still recovering: this is the only suite
    # covering how another compiler reads the metadata this one writes,
    # and integration_tests runs only the parse and semantic groups,
    # which never reach emission. Without this the back end is ungated.
    name: Run cross-assembly tests

    # ghul-test harness runs each .ghulproj in parallel and each `dotnet
    # build` is itself multithreaded. In practice the suite is small enough
    # that the work step finishes in ~5s on 4 vCPU; sized accordingly.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}

    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Add GHCR package source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Install the freshly-built compiler
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul-next.compiler --version ${{ needs.version.outputs.package }} --add-source nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Run cross-assembly tests
      run: bash -c "set -o pipefail ; dotnet ghul-test --use-dotnet-build cross-assembly-tests | tee cross-assembly-test-results.txt"

    - uses: actions/upload-artifact@v7
      with:
        name: cross-assembly-test-results
        path: cross-assembly-test-results.txt

  # Builds ghul-runtime against the freshly built compiler, so it needs
  # the emission surface. Reported but not gating, same as codegen_tests.
  runtime_tests:
    needs: [version, build]
    # Disabled until the binary back end can build a working compiler.
    # A job that always fails costs runner minutes and makes every other
    # result read as suspect. Delete the 'if: false' to re-enable.
    #
    # codegen_tests and cross_assembly_tests need only the back end to
    # emit correctly, so they recover first. runtime_tests and
    # examples_tests additionally need their consumer repositories to
    # build against the result, so they recover last.
    #
    # analysis_tests is the exception and does not depend on the back
    # end at all: it drives --analyse, which emits nothing, and fails
    # only because analysis-tests.ghulproj rebuilds the protocol library
    # from source. Referencing the published package instead would let
    # it pass now.
    #
    # Self-hosting is checked by none of these - see the build job - so
    # restoring it is separate work rather than the end of this list.
    if: false
    name: Run runtime tests
    continue-on-error: true

    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}

    timeout-minutes: 10

    # Build ghul-runtime (latest main, no version pin) against the
    # bootstrapped compiler and run its unit tests. Same symmetry
    # contract as examples_tests: the new compiler must build current
    # ghul-runtime main, and current ghul-runtime main must build
    # under the previously-published compiler. Catches source-compat
    # regressions in the runtime before they require a runtime fix to
    # unstick - e.g. an inference change that silently breaks the
    # runtime test source.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead.
    # See docs/claude/breaking-change-coordination.md.
    - name: Resolve ghul-runtime ref
      id: ref
      shell: bash
      run: |
        set -euo pipefail
        repo=degory/ghul-runtime
        main_sha=$(git ls-remote "https://github.com/${repo}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "https://github.com/${repo}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          # A partial clone can still be writing into .git as the trap
          # runs, so the remove races and reports "Directory not empty".
          # Under `set -e` that status becomes the step's, failing the job
          # on a scratch directory the runner discards anyway.
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "https://github.com/${repo}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-runtime
      uses: actions/checkout@v6
      with:
        repository: degory/ghul-runtime
        path: ghul-runtime
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler in ghul-runtime
      working-directory: ghul-runtime
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul-next.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    - name: Add GHCR package source
      working-directory: ghul-runtime
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Restore local .NET tools
      working-directory: ghul-runtime
      run: dotnet tool restore

    - name: Build ghul-runtime
      working-directory: ghul-runtime
      run: dotnet build

    - name: Run ghul-runtime unit tests
      working-directory: ghul-runtime
      run: dotnet test tests/tests.ghulproj

  # Builds ghul-examples against the freshly built compiler, so it needs
  # the emission surface. Reported but not gating, same as codegen_tests.
  examples_tests:
    needs: [version, build]
    # Disabled until the binary back end can build a working compiler.
    # A job that always fails costs runner minutes and makes every other
    # result read as suspect. Delete the 'if: false' to re-enable.
    #
    # codegen_tests and cross_assembly_tests need only the back end to
    # emit correctly, so they recover first. runtime_tests and
    # examples_tests additionally need their consumer repositories to
    # build against the result, so they recover last.
    #
    # analysis_tests is the exception and does not depend on the back
    # end at all: it drives --analyse, which emits nothing, and fails
    # only because analysis-tests.ghulproj rebuilds the protocol library
    # from source. Referencing the published package instead would let
    # it pass now.
    #
    # Self-hosting is checked by none of these - see the build job - so
    # restoring it is separate work rather than the end of this list.
    if: false
    name: Run examples tests
    continue-on-error: true

    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-4' }}

    timeout-minutes: 10

    # Build ghul-examples (latest main, no version pin) against the
    # bootstrapped compiler. ghul-examples has its own CI gating its
    # main, and the language is generally backwards-compatible, so the
    # contract is symmetric: the new compiler must build current
    # ghul-examples main, and current main ghul-examples must build
    # under the previously-published compiler. This job enforces the
    # first half. Runs on both PR and main push: it gates
    # publish_release_package, so a skipped run would silently block
    # publish on the post-merge run.
    steps:
    # Pick `next` over `main` when it exists and is strictly ahead.
    # See docs/claude/breaking-change-coordination.md.
    - name: Resolve ghul-examples ref
      id: ref
      shell: bash
      run: |
        set -euo pipefail
        repo=degory/ghul-examples
        main_sha=$(git ls-remote "https://github.com/${repo}" refs/heads/main | cut -f1)
        next_sha=$(git ls-remote "https://github.com/${repo}" refs/heads/next | cut -f1 || true)
        ref=main
        if [ -n "${next_sha}" ] && [ "${next_sha}" != "${main_sha}" ]; then
          # A partial clone can still be writing into .git as the trap
          # runs, so the remove races and reports "Directory not empty".
          # Under `set -e` that status becomes the step's, failing the job
          # on a scratch directory the runner discards anyway.
          tmp=$(mktemp -d) && trap "rm -rf '${tmp}' || true" EXIT
          git clone --quiet --filter=blob:none --no-checkout --branch=next --depth=200 "https://github.com/${repo}" "${tmp}"
          git -C "${tmp}" fetch --quiet --depth=200 origin main:refs/remotes/origin/main
          if git -C "${tmp}" merge-base --is-ancestor origin/main next; then
            ref=next
            echo "using ${repo}/next"
          fi
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Checkout ghul-examples
      uses: actions/checkout@v6
      with:
        repository: degory/ghul-examples
        path: ghul-examples
        ref: ${{ steps.ref.outputs.ref }}

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/.config/dotnet-tools.json

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Install the freshly-built compiler in ghul-examples
      working-directory: ghul-examples
      run: dotnet tool uninstall --local ghul.compiler || true; dotnet tool install --local ghul-next.compiler --version ${{ needs.version.outputs.package }} --add-source ../nupkg

    - name: Add GHCR package source
      working-directory: ghul-examples
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/degory/index.json"

    - name: Restore local .NET tools
      working-directory: ghul-examples
      run: dotnet tool restore

    - name: Build examples
      working-directory: ghul-examples
      run: dotnet build

    - name: Run examples integration tests
      working-directory: ghul-examples
      run: dotnet ghul-test --use-dotnet-build integration-tests

  code_review:
    name: Code review
    # Skipped on a fork: the reviewer's credentials are repository secrets, which
    # GitHub withholds from a pull request raised from one. A fork's pull request
    # is reviewed and approved by hand instead.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: degory/ghul-code-review/.github/workflows/review.yml@v4
    with:
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '90') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '3') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      # Pinned rather than left to the fleet default, which this would
      # otherwise follow upwards. Replacing the IL back end is months of
      # pull requests, and none of them warrant the top tier.
      tier: medium
      prompt: |
        Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether the diff parses, compiles, and passes tests is gated by CI and GitHub branch protection before merge - that's not your job. Trust the diff as written; don't try to mentally compile, run tests, or verify self-hosting.

        Read these files first, in order:
        1. .github/claude-review.md - how to operate, severity bar, what to flag
        2. CONTRIBUTING.md - test requirements and the type-system change protocol
        3. GHUL.md - ghūl language reference (consult as needed while reading the diff)
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      qwen-auth-token: ${{ secrets.OPENCODE_API_KEY }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}

  publish_beta_package:
    needs: [version, unit_tests, integration_tests]
    name: Publish beta package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # Declared rather than inherited: this repository's default workflow token
    # is read-only, and pushing to the GitHub feed needs packages:write.
    permissions:
      contents: read
      packages: write

    # Skipped on a fork regardless: GitHub downgrades the token a fork's pull
    # request gets to read-only, so the scope above cannot be granted there.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    steps:
    - uses: actions/checkout@v6

    - name: Download ghul compiler tool package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download analysis protocol package
      uses: actions/download-artifact@v8
      with:
        name: ghul-analysis-protocol-package
        path: nupkg

    - name: Publish beta package to GitHub
      run: dotnet nuget push ./nupkg/ghul-next.compiler.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/degory/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish analysis protocol beta package to GitHub
      run: dotnet nuget push ./nupkg/ghul-next.analysis.protocol.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/degory/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release_package:
    needs: [version, unit_tests, integration_tests]
    name: Publish release package

    timeout-minutes: 5

    runs-on: ubuntu-latest

    # Declared rather than inherited: this repository's default workflow token
    # is read-only, and pushing to the GitHub feed needs packages:write.
    permissions:
      contents: read
      packages: write

    if: ${{ github.event_name != 'pull_request' }}

    steps:
    - uses: actions/checkout@v6

    - name: Download ghul compiler tool package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Download analysis protocol package
      uses: actions/download-artifact@v8
      with:
        name: ghul-analysis-protocol-package
        path: nupkg

    # Never nuget.org. `ghul-next.compiler` is an experimental build of the
    # compiler with an unfinished IL back end; it is published to the GitHub
    # feed so branch work can consume it, and nowhere else.
    - name: Publish release package to GitHub
      run: dotnet nuget push ./nupkg/ghul-next.compiler.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/degory/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish analysis protocol release package to GitHub
      run: dotnet nuget push ./nupkg/ghul-next.analysis.protocol.${{ needs.version.outputs.package }}.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/degory/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_release:
    needs: [version, integration_tests, publish_release_package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    - name: Download ghul-next.compiler package
      uses: actions/download-artifact@v8
      with:
        name: ghul-compiler-package
        path: nupkg

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul-next.compiler.${{ needs.version.outputs.package }}.nupkg \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt
